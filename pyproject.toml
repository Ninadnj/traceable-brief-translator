[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compoundx-demo"
version = "1.0.0"
description = "Traceable AI-assisted translation of product briefs into engineering dossiers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.50,<3",
    "pydantic>=2,<3",
    "pypdf>=5,<7",
    "reportlab>=4,<5",
    "streamlit[pdf]>=1.60,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
compoundx-demo = "compoundx.main:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
compoundx = ["prompts/*.txt"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
